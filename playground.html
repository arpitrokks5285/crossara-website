<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CROSSARA Labs Playground</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/playground.css">
</head>
<body class="playground-page">
  <main class="playground-shell">
    <a class="playground-back" href="index.html" aria-label="Back to CROSSARA">← Back to CROSSARA</a>
    <header class="playground-header">
      <p class="playground-eyebrow">CROSSARA LABS</p>
      <h1>Playground</h1>
      <p>Move the CROSSARA icon, line up the target, and fire.</p>
    </header>

    <section class="playground-stage" aria-label="Interactive CROSSARA playground">
      <div class="playground-hud">
        <span>SCORE <strong id="playgroundScore">0</strong></span>
        <button id="playgroundReset" type="button">RESET</button>
      </div>

      <div class="playground-arena" id="playgroundArena" aria-label="Aim arena. On desktop, left click to fire.">
        <button class="playground-target" id="playgroundTarget" type="button" aria-label="Target"></button>
        <div class="playground-crosshair playground-logo-aim" id="playgroundCrosshair" aria-hidden="true">
          <img src="assets/crossara-app-icon-512.png" alt="">
        </div>
      </div>

      <div class="playground-controls">
        <div class="playground-stick" id="playgroundStick" aria-label="Virtual joystick">
          <div class="playground-stick-knob" id="playgroundStickKnob"></div>
        </div>
        <button class="playground-fire" id="playgroundFire" type="button">FIRE</button>
      </div>

      <section class="playground-control-guide" aria-label="Playground controls">
        <div class="playground-guide-card">
          <span class="playground-guide-label">MOBILE</span>
          <strong>Touch controls</strong>
          <div class="playground-guide-row">
            <span class="control-chip">JOYSTICK</span>
            <span>Move</span>
          </div>
          <div class="playground-guide-row">
            <span class="control-chip">FIRE</span>
            <span>Shoot</span>
          </div>
        </div>

        <div class="playground-guide-card">
          <span class="playground-guide-label">DESKTOP</span>
          <strong>Keyboard + mouse</strong>
          <div class="playground-key-map" aria-label="Movement keys">
            <span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span>
            <span class="guide-or">or</span>
            <span class="keycap">↑</span><span class="keycap">←</span><span class="keycap">↓</span><span class="keycap">→</span>
          </div>
          <div class="playground-guide-row playground-guide-shoot">
            <span class="control-chip">LEFT CLICK</span>
            <span class="control-chip">SPACE</span>
            <span class="control-chip">ENTER</span>
            <span>Shoot</span>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="assets/playground.js"></script>
</body>
</html>
